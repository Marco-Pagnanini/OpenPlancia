appId: app.plancia
productName: Plancia
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
      - '!.gitkeep'
asarUnpack:
  - '**/*.node'
mac:
  target: dmg
  category: public.app-category.developer-tools
  identity: null
win:
  target: nsis
linux:
  target: AppImage
  category: Development
publish: null
