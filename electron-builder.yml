appId: app.openplancia
productName: OpenPlancia
copyright: Copyright © 2026 Marco Pagnanini
directories:
  output: release
  buildResources: resources
# electron-vite already bundles the renderer: only main's runtime dependencies (package.json
# "dependencies") end up in node_modules inside the package.
files:
  - out/**
  - package.json
extraResources:
  # plancia-hook.cjs is run by Claude Code with ELECTRON_RUN_AS_NODE: it must be a real file.
  - from: resources
    to: resources
    filter:
      - '**/*'
      - '!.gitkeep'
asarUnpack:
  - '**/*.node'
  # node-pty loads its native module and spawn-helper from disk.
  - 'node_modules/node-pty/**'
# Makes node-pty's spawn-helper executable again (see the script).
afterPack: scripts/after-pack.cjs
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Ad-hoc signature, no Apple Developer ID nor notarization: macOS asks to confirm the first
  # launch (see README). Without any signature, an app downloaded on Apple Silicon is reported
  # as "damaged". Hardened runtime would reject Electron's frameworks under an ad-hoc signature.
  identity: '-'
  hardenedRuntime: false
dmg:
  title: ${productName} ${version}
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: Marco Pagnanini <Marco-Pagnanini@users.noreply.github.com>
  synopsis: Lavagna infinita per lavorare con Claude Code
publish: null
